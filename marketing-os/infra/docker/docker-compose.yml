# Local infrastructure only (Postgres, Redis, Mailpit). Run the API and web app on the host:
#   cd apps/api && php artisan serve      cd apps/web && npm run dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mios
      POSTGRES_PASSWORD: mios
      POSTGRES_DB: mios_dev
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mios']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025'] # SMTP, web UI
volumes:
  pgdata:
