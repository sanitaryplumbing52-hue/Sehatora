  '/orgs/{org}/projects/{project}/dashboard/overview':
    get:
      summary: 'Executive overview as MetricEnvelopes; never contains fabricated values'
      tags:
        - Dashboard
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardOverview'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: getDashboardOverview
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          $ref: '#/components/parameters/projectId'
  '/orgs/{org}/projects/{project}/websites':
    get:
      summary: 'List websites'
      tags:
        - Websites
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Website'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: listWebsites
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          $ref: '#/components/parameters/projectId'
    post:
      summary: 'Add website (URL is normalised to an origin)'
      tags:
        - Websites
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Website'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: createWebsite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                name:
                  type:
                    - string
                    - 'null'
                cms:
                  type: string
                  enum:
                    - unknown
                    - wordpress
                    - shopify
                    - other
              required:
                - url
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          $ref: '#/components/parameters/projectId'
  '/orgs/{org}/projects/{project}/websites/{website}':
    get:
      summary: 'Get website'
      tags:
        - Websites
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Website'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: getWebsite
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          $ref: '#/components/parameters/projectId'
        -
          $ref: '#/components/parameters/websiteId'
    patch:
      summary: 'Update website name / CMS (URL is immutable)'
      tags:
        - Websites
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Website'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: updateWebsite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type:
                    - string
                    - 'null'
                cms:
                  type: string
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          $ref: '#/components/parameters/projectId'
        -
          $ref: '#/components/parameters/websiteId'
    delete:
      summary: 'Delete website'
      tags:
        - Websites
      responses:
        204:
          description: Deleted
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: deleteWebsite
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          $ref: '#/components/parameters/projectId'
        -
          $ref: '#/components/parameters/websiteId'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mios_session
  parameters:
    org:
      name: org
      in: path
      required: true
      description: 'Organization UUID or slug'
      schema:
        type: string
    projectId:
      name: project
      in: path
      required: true
      schema:
        type: string
        format: uuid
    websiteId:
      name: website
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: user
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: 'Not signed in (code: unauthenticated)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'Missing permission, unverified email, entitlement exceeded or role rule (code varies)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 'Not found, or not a member of the organization (no existence leak)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: 'Validation or business rule failed (code: validation_failed | invalid_credentials | website_already_exists | ...)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 'Too many requests (code: rate_limited | login_locked; see retry_after)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        action:
          type: object
          properties:
            label:
              type: string
            href:
              type: string
        retry_after:
          type: integer
        feature:
          type: string
      required:
        - type
        - title
        - status
        - code
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        two_factor_enabled:
          type: boolean
        locale:
          type: string
        timezone:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - email_verified
        - two_factor_enabled
    RegisterInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        password_confirmation:
          type: string
      required:
        - name
        - email
        - password
        - password_confirmation
    DeviceSession:
      type: object
      properties:
        id:
          type: string
        is_current:
          type: boolean
        ip_address:
          type:
            - string
            - 'null'
        user_agent:
          type:
            - string
            - 'null'
        last_active_at:
          type: string
          format: date-time
      required:
        - id
        - is_current
    LoginActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
            - success
            - failed
            - two_factor_failed
            - locked
        ip_address:
          type:
            - string
            - 'null'
        user_agent:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - outcome
        - created_at
    TwoFactorEnrolment:
      type: object
      properties:
        secret:
          type: string
        otpauth_url:
          type: string
        qr_svg:
          type: string
      required:
        - secret
        - otpauth_url
        - qr_svg
    RecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
      required:
        - recovery_codes
    RoleRef:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
      required:
        - key
        - name
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
        default_currency:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
    Membership:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          $ref: '#/components/schemas/RoleRef'
        permissions:
          type: array
          items:
            type: string
      required:
        - organization
        - role
        - permissions
    RoleDefinition:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        rank:
          type: integer
        permissions:
          type: array
          items:
            type: string
      required:
        - key
        - name
        - rank
        - permissions
    Member:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/RoleRef'
        two_factor_enabled:
          type: boolean
        joined_at:
          type: string
          format: date-time
      required:
        - user_id
        - name
        - email
        - role
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/RoleRef'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - expires_at
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actor_id:
          type:
            - string
            - 'null'
        actor_email:
          type:
            - string
            - 'null'
        subject_type:
          type:
            - string
            - 'null'
        subject_id:
          type:
            - string
            - 'null'
        project_id:
          type:
            - string
            - 'null'
        metadata:
          type:
            - object
            - 'null'
        ip_address:
          type:
            - string
            - 'null'
        request_id:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - action
        - created_at
    ProjectInput:
      type: object
      properties:
        name:
          type: string
        industry:
          type:
            - string
            - 'null'
        market:
          type:
            - string
            - 'null'
        currency:
          type: string
        timezone:
          type: string
        goals:
          type:
            - array
            - 'null'
          items:
            type: string
        archived:
          type: boolean
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        industry:
          type:
            - string
            - 'null'
        market:
          type:
            - string
            - 'null'
        currency:
          type: string
        timezone:
          type: string
        goals:
          type:
            - array
            - 'null'
          items:
            type: string
        archived:
          type: boolean
        websites:
          type: array
          items:
            $ref: '#/components/schemas/Website'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - currency
        - timezone
        - archived
    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        host:
          type: string
        is_primary:
          type: boolean
        ownership_verified:
          type: boolean
      required:
        - id
        - host
        - is_primary
        - ownership_verified
    Website:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type:
            - string
            - 'null'
        url:
          type: string
        cms:
          type: string
        verified:
          type: boolean
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - url
        - cms
        - verified
    MetricEnvelope:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        status:
          type: string
          enum:
            - ok
            - not_connected
            - unavailable
            - insufficient_data
            - stale
            - error
            - no_data
        value:
          type:
            - number
            - 'null'
          description: 'Null unless status is ok or stale. Never a fabricated fallback.'
        unit:
          type: string
          enum:
            - count
            - ratio
            - currency
            - position
        period:
          type:
            - object
            - 'null'
        comparison:
          type:
            - object
            - 'null'
        source:
          type:
            - object
            - 'null'
        expected_sources:
          type: array
          items:
            type: string
        last_synced_at:
          type:
            - string
            - 'null'
        calculation:
          type: string
        attribution_note:
          type:
            - string
            - 'null'
        lineage_id:
          type:
            - string
            - 'null'
        reason:
          type:
            - string
            - 'null'
        action:
          type:
            - object
            - 'null'
          properties:
            label:
              type: string
            href:
              type: string
      required:
        - key
        - label
        - status
        - value
        - unit
        - calculation
    DashboardOverview:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        onboarding:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              done:
                type: boolean
            required:
              - key
              - label
              - done
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricEnvelope'
      required:
        - project_id
        - onboarding
        - metrics
    IntegrationProvider:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        category:
          type: string
        available_in_phase:
          type: integer
        status:
          type: string
          enum:
            - not_connected
            - connected
            - needs_reauth
            - error
        available:
          type: boolean
        unavailable_reason:
          type: string
      required:
        - key
        - name
        - status
        - available
    HealthDetails:
      type: object
      properties:
        status:
          type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
              detail:
                type: string
            required:
              - status
      required:
        - status
        - checks
