# Marketing Intelligence OS — API contract (source of truth for the generated TypeScript client).
# tests/Feature/Platform/OpenApiParityTest fails if a route and this file disagree.
openapi: 3.1.0
info:
  title: 'Marketing Intelligence OS API'
  version: 1.0.0-phase1
  description: 'Cookie-session API (Sanctum-style CSRF flow: GET /sanctum/csrf-cookie, then send X-XSRF-TOKEN). Every /orgs/{org}/* route is tenant-scoped; non-members receive 404. Errors are RFC 9457 problem details. No endpoint ever returns fabricated metrics: see MetricEnvelope.status.'
servers:
  -
    url: /api/v1
security:
  -
    cookieAuth: []
paths:
  /system/health:
    get:
      summary: 'Coarse public health (status only)'
      tags:
        - System
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
        503:
          description: Degraded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - down
                required:
                  - status
      operationId: getHealth
      security: []
  /system/health/details:
    get:
      summary: 'Detailed infrastructure health (bearer HEALTH_CHECK_TOKEN)'
      tags:
        - System
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDetails'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: getHealthDetails
      security: []
  /auth/register:
    post:
      summary: 'Register and sign in; sends a verification email'
      tags:
        - Auth
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      security: []
  /auth/login:
    post:
      summary: 'Sign in (may require a second factor)'
      tags:
        - Auth
      responses:
        200:
          description: 'Signed in, or second factor required'
          content:
            application/json:
              schema:
                oneOf:
                  -
                    type: object
                    required:
                      - data
                    properties:
                      data: { $ref: '#/components/schemas/User' }
                  -
                    type: object
                    properties:
                      two_factor_required: { type: boolean, enum: [true] }
                    required:
                      - two_factor_required
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                remember:
                  type: boolean
              required:
                - email
                - password
      security: []
  /auth/2fa/challenge:
    post:
      summary: 'Complete sign-in with a TOTP or recovery code'
      tags:
        - Auth
      responses:
        200:
          description: 'Signed in'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
      operationId: twoFactorChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                recovery_code:
                  type: string
      security: []
  /auth/logout:
    post:
      summary: 'Sign out'
      tags:
        - Auth
      responses:
        204:
          description: 'Signed out'
        401:
          $ref: '#/components/responses/Unauthenticated'
      operationId: logout
  /auth/forgot-password:
    post:
      summary: 'Send a reset link (always 202)'
      tags:
        - Auth
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      security: []
  /auth/reset-password:
    post:
      summary: 'Reset password with emailed token'
      tags:
        - Auth
      responses:
        200:
          description: Reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  '/auth/email/verify/{id}/{hash}':
    get:
      summary: 'Signed verification link target; redirects into the web app'
      tags:
        - Auth
      responses:
        302:
          description: 'Redirect to the web app'
        403:
          $ref: '#/components/responses/Forbidden'
      operationId: verifyEmail
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: hash
          in: path
          required: true
          schema:
            type: string
      security: []
  /auth/email/resend:
    post:
      summary: 'Resend verification email'
      tags:
        - Auth
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        401:
          $ref: '#/components/responses/Unauthenticated'
        429:
          $ref: '#/components/responses/RateLimited'
      operationId: resendVerification
  /me:
    get:
      summary: 'Current user'
      tags:
        - Me
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthenticated'
      operationId: getMe
    patch:
      summary: 'Update profile'
      tags:
        - Me
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                locale:
                  type: string
                  enum:
                    - en
                    - ar
                timezone:
                  type: string
  /me/password:
    put:
      summary: 'Change password; signs out other devices'
      tags:
        - Me
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
                - current_password
                - password
                - password_confirmation
  /me/sessions:
    get:
      summary: 'List signed-in devices'
      tags:
        - Me
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceSession'
        401:
          $ref: '#/components/responses/Unauthenticated'
      operationId: listSessions
  '/me/sessions/{id}':
    delete:
      summary: 'Revoke a device session'
      tags:
        - Me
      responses:
        204:
          description: Revoked
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: revokeSession
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
  /me/login-activity:
    get:
      summary: 'Recent sign-in activity'
      tags:
        - Me
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoginActivity'
        401:
          $ref: '#/components/responses/Unauthenticated'
      operationId: listLoginActivity
  /me/organizations:
    get:
      summary: 'Organizations I belong to, with role and permissions'
      tags:
        - Me
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
        401:
          $ref: '#/components/responses/Unauthenticated'
      operationId: listMyOrganizations
  /me/2fa/enable:
    post:
      summary: 'Begin two-factor enrolment'
      tags:
        - Me
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/TwoFactorEnrolment'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: enableTwoFactor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
                - password
  /me/2fa/confirm:
    post:
      summary: 'Confirm enrolment; returns recovery codes once'
      tags:
        - Me
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/RecoveryCodes'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: confirmTwoFactor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
                - code
  /me/2fa:
    delete:
      summary: 'Disable two-factor auth'
      tags:
        - Me
      responses:
        204:
          description: Disabled
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: disableTwoFactor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
                - password
  /orgs:
    post:
      summary: 'Create organization (verified email required); creator becomes Owner'
      tags:
        - Organizations
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                timezone:
                  type: string
                default_currency:
                  type: string
              required:
                - name
  /roles:
    get:
      summary: 'System roles and their permissions'
      tags:
        - Organizations
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleDefinition'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
      operationId: listRoles
  /invitations/accept:
    post:
      summary: 'Accept an invitation (must be signed in as the invited email)'
      tags:
        - Organizations
      responses:
        200:
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
  '/orgs/{org}':
    get:
      summary: 'Organization with my role'
      tags:
        - Organizations
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: getOrganization
      parameters:
        -
          $ref: '#/components/parameters/org'
    patch:
      summary: 'Update organization (org.update)'
      tags:
        - Organizations
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                timezone:
                  type: string
                default_currency:
                  type: string
      parameters:
        -
          $ref: '#/components/parameters/org'
    delete:
      summary: 'Delete organization (Owner; password confirmation)'
      tags:
        - Organizations
      responses:
        204:
          description: Deleted
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: deleteOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
                - password
      parameters:
        -
          $ref: '#/components/parameters/org'
  '/orgs/{org}/leave':
    post:
      summary: 'Leave organization'
      tags:
        - Organizations
      responses:
        204:
          description: Left
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: leaveOrganization
      parameters:
        -
          $ref: '#/components/parameters/org'
  '/orgs/{org}/members':
    get:
      summary: 'List members (members.view)'
      tags:
        - Members
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: listMembers
      parameters:
        -
          $ref: '#/components/parameters/org'
  '/orgs/{org}/members/{user}':
    patch:
      summary: "Change a member's role (members.manage)"
      tags:
        - Members
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: updateMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - owner
                    - admin
                    - manager
                    - analyst
                    - editor
                    - viewer
              required:
                - role
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          $ref: '#/components/parameters/userId'
    delete:
      summary: 'Remove a member (members.manage)'
      tags:
        - Members
      responses:
        204:
          description: Removed
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: removeMember
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          $ref: '#/components/parameters/userId'
  '/orgs/{org}/invitations':
    get:
      summary: 'Pending invitations (members.view)'
      tags:
        - Members
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: listInvitations
      parameters:
        -
          $ref: '#/components/parameters/org'
    post:
      summary: 'Invite by email (members.manage)'
      tags:
        - Members
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Invitation'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                role:
                  type: string
              required:
                - email
                - role
      parameters:
        -
          $ref: '#/components/parameters/org'
  '/orgs/{org}/invitations/{invitation}':
    delete:
      summary: 'Revoke an invitation (members.manage)'
      tags:
        - Members
      responses:
        204:
          description: Revoked
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: revokeInvitation
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          name: invitation
          in: path
          required: true
          schema:
            type: string
            format: uuid
  '/orgs/{org}/audit-logs':
    get:
      summary: 'Audit log, newest first, cursor-paginated (audit.view)'
      tags:
        - Audit
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  meta:
                    type: object
                    properties:
                      next_cursor: { type: [string, 'null'] }
                required:
                  - data
                  - meta
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: listAuditLogs
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          name: action
          in: query
          schema:
            type: string
          description: 'Action prefix, e.g. project.'
        -
          name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: cursor
          in: query
          schema:
            type: string
  '/orgs/{org}/integrations':
    get:
      summary: 'Provider catalog with connection state'
      tags:
        - Integrations
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntegrationProvider'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: listIntegrations
      parameters:
        -
          $ref: '#/components/parameters/org'
  '/orgs/{org}/projects':
    get:
      summary: 'List projects (projects.view)'
      tags:
        - Projects
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  links:
                    type: object
                  meta:
                    type: object
                required:
                  - data
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: listProjects
      parameters:
        -
          $ref: '#/components/parameters/org'
        -
          name: archived
          in: query
          schema:
            type: boolean
        -
          name: per_page
          in: query
          schema:
            type: integer
        -
          name: page
          in: query
          schema:
            type: integer
    post:
      summary: 'Create project (projects.manage; plan limit projects.max)'
      tags:
        - Projects
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      parameters:
        -
          $ref: '#/components/parameters/org'
  '/orgs/{org}/projects/{project}':
    get:
      summary: 'Get project'
      tags:
        - Projects
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      operationId: getProject
